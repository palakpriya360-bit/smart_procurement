<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Portal - ProcureSmart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav class="navbar">

    <div class="logo">
        🌾 ProcureSmart
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="farmer.html">
            Farmer
        </a>

        <a href="centre.html">
            Centre
        </a>

    </div>

</nav>


<!-- =========================================================
     FARMER PORTAL
========================================================= -->

<section class="features">

    <h1>
        👨‍🌾 Farmer Portal
    </h1>

    <p>
        Find the nearest and most suitable procurement centre
        and book your procurement slot.
    </p>

    <br>


    <!-- =====================================================
         BOOKING CARD
    ====================================================== -->

    <div class="feature-card">

        <h2>
            Smart Procurement Booking
        </h2>

        <br>


        <form id="bookingForm">


            <!-- =================================================
                 FARMER NAME
            ================================================== -->

            <label for="farmerName">
                Farmer Name
            </label>

            <br>

            <input
                type="text"
                id="farmerName"
                placeholder="Enter your name"
                required
            >

            <br>
            <br>


            <!-- =================================================
                 MOBILE
            ================================================== -->

            <label for="mobile">
                Mobile Number
            </label>

            <br>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <br>
            <br>


            <!-- =================================================
                 CROP
            ================================================== -->

            <label for="produce">
                Produce
            </label>

            <br>

            <select id="produce" required>

                <option value="">
                    Select Produce
                </option>

                <option value="Rice">
                    Rice
                </option>

                <option value="Paddy">
                    Paddy
                </option>

                <option value="Wheat">
                    Wheat
                </option>

                <option value="Maize">
                    Maize
                </option>

                <option value="Mustard">
                    Mustard
                </option>

                <option value="Coconut">
                    Coconut
                </option>

                <option value="Groundnut">
                    Groundnut
                </option>

            </select>

            <br>
            <br>


            <!-- =================================================
                 QUANTITY
            ================================================== -->

            <label for="quantity">
                Quantity (Quintals)
            </label>

            <br>

            <input
                type="number"
                id="quantity"
                min="0.1"
                step="0.1"
                placeholder="Enter quantity in quintals"
                required
            >

            <br>
            <br>


            <!-- =================================================
                 GPS LOCATION
            ================================================== -->

            <label>
                📍 Your Current Location
            </label>

            <br>

            <button
                type="button"
                id="locationButton"
                class="btn"
                onclick="getFarmerLocation()"
            >
                📍 Detect My Location
            </button>

            <br>
            <br>


            <p id="locationStatus">

                📍 Location not detected yet.

            </p>


            <!-- Hidden coordinate fields -->

            <input
                type="hidden"
                id="latitude"
            >

            <input
                type="hidden"
                id="longitude"
            >


            <br>


            <!-- =================================================
                 OPTIONAL LOCATION TEXT
            ================================================== -->

            <label for="location">
                Location Name
            </label>

            <br>

            <input
                type="text"
                id="location"
                placeholder="Example: Bhubaneswar"
            >

            <br>
            <br>


            <!-- =================================================
                 DATABASE STATUS
            ================================================== -->

            <p id="databaseStatus">

                🔄 Loading procurement centre database...

            </p>

            <br>


            <!-- =================================================
                 RECOMMENDED CENTRE
            ================================================== -->

            <label for="centre">
                Recommended Procurement Centre
            </label>

            <br>

            <select
                id="centre"
                required
            >

                <option value="">
                    Enter quantity and detect location first
                </option>

            </select>

            <br>
            <br>


            <!-- =================================================
                 SMART RECOMMENDATION
            ================================================== -->

            <div
                id="recommendationBox"
                style="display:none;"
            >

                <h3>
                    ⭐ Smart Recommendation
                </h3>

                <br>

                <p id="recommendationText"></p>

            </div>

            <br>


            <!-- =================================================
                 DATE
            ================================================== -->

            <label for="date">
                Preferred Date
            </label>

            <br>

            <input
                type="date"
                id="date"
                required
            >

            <br>
            <br>


            <!-- =================================================
                 TIME SLOT
            ================================================== -->

            <label for="slot">
                Available Time Slot
            </label>

            <br>

            <select
                id="slot"
                required
            >

                <option value="">
                    Select centre first
                </option>

            </select>

            <br>
            <br>


            <!-- =================================================
                 BOOK BUTTON
            ================================================== -->

            <button
                type="submit"
                class="btn"
            >

                📅 Book Smart Slot

            </button>


        </form>

    </div>

</section>


<!-- =========================================================
     XLSX LIBRARY
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">
</script>


<!-- =========================================================
     PROCURESMART JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
