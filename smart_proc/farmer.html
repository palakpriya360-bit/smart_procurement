<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Portal - ProcureSmart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================================================
     NAVIGATION
========================================================= -->

<nav class="navbar">

    <div class="logo">
        🌾 ProcureSmart
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="farmer.html">
            Farmer
        </a>

        <a href="centre.html">
            Centre
        </a>

    </div>

</nav>



<!-- =========================================================
     FARMER PORTAL
========================================================= -->

<section class="features">

    <h1>
        👨‍🌾 Farmer Portal
    </h1>

    <p>
        Find the nearest suitable procurement centre
        and book your procurement slot.
    </p>

    <br>


    <!-- =====================================================
         BOOKING CARD
    ====================================================== -->

    <div class="feature-card">

        <h2>
            📅 Smart Procurement Booking
        </h2>

        <br>


        <form id="bookingForm">


            <!-- =================================================
                 FARMER NAME
            ================================================== -->

            <label for="farmerName">
                Farmer Name
            </label>

            <br>

            <input
                type="text"
                id="farmerName"
                placeholder="Enter your name"
                required
            >

            <br>
            <br>



            <!-- =================================================
                 MOBILE
            ================================================== -->

            <label for="mobile">
                Mobile Number
            </label>

            <br>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required
            >

            <br>
            <br>



            <!-- =================================================
                 CROP
            ================================================== -->

            <label for="produce">
                🌾 Produce
            </label>

            <br>

            <select id="produce" required>

                <option value="">
                    Select Produce
                </option>

                <option value="Rice">
                    Rice
                </option>

                <option value="Wheat">
                    Wheat
                </option>

                <option value="Maize">
                    Maize
                </option>

                <option value="Mustard">
                    Mustard
                </option>

                <option value="Coconut">
                    Coconut
                </option>

                <option value="Groundnut">
                    Groundnut
                </option>

                <option value="Ragi">
                    Ragi
                </option>

                <option value="Banana">
                    Banana
                </option>

                <option value="Soybean">
                    Soybean
                </option>

                <option value="Pulses">
                    Pulses
                </option>

                <option value="Potato">
                    Potato
                </option>

                <option value="Bajra">
                    Bajra
                </option>

                <option value="Chilli">
                    Chilli
                </option>

                <option value="Ginger">
                    Ginger
                </option>

                <option value="Cotton">
                    Cotton
                </option>

                <option value="Apple">
                    Apple
                </option>

                <option value="Turmeric">
                    Turmeric
                </option>

                <option value="Sugarcane">
                    Sugarcane
                </option>

                <option value="Pineapple">
                    Pineapple
                </option>

            </select>

            <br>
            <br>



            <!-- =================================================
                 QUANTITY
            ================================================== -->

            <label for="quantity">
                📦 Quantity (Quintals)
            </label>

            <br>

            <input
                type="number"
                id="quantity"
                min="0.1"
                step="0.1"
                placeholder="Enter quantity in quintals"
                required
            >

            <br>
            <br>



            <!-- =================================================
                 GPS LOCATION
            ================================================== -->

            <label>
                📍 Your GPS Location
            </label>

            <br>

            <button
                type="button"
                class="btn"
                id="gpsButton"
            >
                📍 Detect My Location
            </button>

            <br>
            <br>

            <div
                id="gpsStatus"
                style="
                    padding:15px;
                    background:#f5f5f5;
                    border-radius:10px;
                "
            >

                📍 Location not detected yet.

            </div>

            <br>



            <!-- =================================================
                 DATABASE STATUS
            ================================================== -->

            <p id="databaseStatus">

                🔄 Loading procurement centre database...

            </p>

            <br>



            <!-- =================================================
                 RECOMMENDED CENTRE
            ================================================== -->

            <label for="centre">

                🏢 Recommended Procurement Centre

            </label>

            <br>

            <select
                id="centre"
                required
            >

                <option value="">

                    Detecting suitable centres...

                </option>

            </select>

            <br>
            <br>



            <!-- =================================================
                 SMART RECOMMENDATION
            ================================================== -->

            <div
                id="recommendationBox"
                style="
                    display:none;
                    background:#e8f5e9;
                    padding:20px;
                    border-radius:15px;
                    margin-top:15px;
                "
            >

                <h3>
                    ⭐ Smart Recommendation
                </h3>

                <br>

                <p id="recommendationText"></p>

            </div>

            <br>



            <!-- =================================================
                 DATE
            ================================================== -->

            <label for="date">

                📅 Preferred Date

            </label>

            <br>

            <input
                type="date"
                id="date"
                required
            >

            <br>
            <br>



            <!-- =================================================
                 AVAILABLE TIME SLOT
            ================================================== -->

            <label for="slot">

                🕐 Available Time Slot

            </label>

            <br>

            <select
                id="slot"
                required
            >

                <option value="">

                    Select centre and date first

                </option>

            </select>

            <br>
            <br>



            <!-- =================================================
                 BOOK BUTTON
            ================================================== -->

            <button
                type="submit"
                class="btn"
            >

                📅 Book Smart Slot

            </button>


        </form>

    </div>

</section>



<!-- =========================================================
     XLSX LIBRARY
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">
</script>



<!-- =========================================================
     OUR JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


</body>

</html>
