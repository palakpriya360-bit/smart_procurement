<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Portal - ProcureSmart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌾 ProcureSmart
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="farmer.html">Farmer</a>

        <a href="centre.html">Centre</a>

    </div>

</nav>


<section class="features">

    <h1>👨‍🌾 Farmer Portal</h1>

    <p>
        Book your procurement slot without waiting
        unnecessarily at the centre.
    </p>

    <br>


    <div class="feature-card">

        <h2>Book Procurement Slot</h2>

        <br>

        <form id="bookingForm">

            <label>Farmer Name</label>

            <br>

            <input
                type="text"
                id="farmerName"
                required
            >

            <br><br>


            <label>Mobile Number</label>

            <br>

            <input
                type="tel"
                id="mobile"
                required
            >

            <br><br>


            <label>Produce</label>

            <br>

            <select id="produce">

                <option>Paddy</option>

                <option>Wheat</option>

                <option>Maize</option>

                <option>Other</option>

            </select>

            <br><br>


            <label>Quantity (kg)</label>

            <br>

            <input
                type="number"
                id="quantity"
                min="1"
                required
            >

            <br><br>


            <label>Procurement Centre</label>

            <br>

            <select id="centre">

                <option>
                    Centre A — 35 min wait
                </option>

                <option>
                    Centre B — 12 min wait ⭐ Recommended
                </option>

                <option>
                    Centre C — 42 min wait
                </option>

            </select>

            <br><br>


            <label>Preferred Date</label>

            <br>

            <input
                type="date"
                id="date"
                required
            >

            <br><br>


            <label>Time Slot</label>

            <br>

            <select id="slot">

                <option>09:00 AM</option>

                <option>10:00 AM</option>

                <option>11:00 AM</option>

                <option>12:00 PM</option>

                <option>01:00 PM</option>

            </select>

            <br><br>


            <button
                type="submit"
                class="btn"
            >
                📅 Book Slot
            </button>

        </form>

    </div>

</section>


<script src="script.js"></script>

</body>

</html>
